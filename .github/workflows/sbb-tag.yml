# Session, but Better — tag every new version of ours.
#
# Whenever session-but-better gains code changes, tag it with upstream's version tag plus
# `-better`: v1.18.5-better, then v1.18.5-better.2, .3 ... for further releases on the same
# upstream version. Doc-only and CI-only changes are not tagged.
# After pushing the tag it starts sbb-release.yml directly, because a tag pushed with the
# Actions token does not trigger other workflows.
name: Tag release

on:
  push:
    branches: [session-but-better]
  workflow_dispatch:

concurrency:
  group: sbb-tag
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag:
    if: vars.SBB_AUTOMATION == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: session-but-better
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Decide and create the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "Damien Heiser"
          git config user.email "dc@arf.io"
          git fetch --quiet --no-tags https://github.com/session-foundation/session-desktop.git +refs/heads/dev:refs/remotes/upstream/dev

          if git tag --points-at HEAD | grep -qE -- '-better(\.[0-9]+)?$'; then
            echo "HEAD is already tagged: $(git tag --points-at HEAD | tr '\n' ' ')"; exit 0
          fi

          last=$(git describe --tags --match 'v*-better*' --abbrev=0 HEAD 2>/dev/null || true)
          if [ -n "$last" ]; then
            code=$(git diff --name-only "$last..HEAD" | grep -vE '^(docs/|\.github/)|\.md$' || true)
            if [ -z "$code" ]; then
              echo "only docs/CI changed since $last; not tagging"; exit 0
            fi
          fi

          version=$(node -p "require('./package.json').version")
          if ! git rev-parse -q --verify "refs/tags/v${version}-better" >/dev/null; then
            tag="v${version}-better"
          else
            n=$(git tag -l "v${version}-better.*" | sed "s/^v${version}-better\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)
            tag="v${version}-better.$(( ${n:-1} + 1 ))"
          fi

          base=$(git merge-base HEAD upstream/dev)
          {
            echo "Session, but Better ${tag}"
            echo
            echo "Upstream base: session-foundation/session-desktop@$(git rev-parse --short "$base") (v${version})"
            for b in full-screen-chat multi-account; do
              if git rev-parse -q --verify "origin/$b" >/dev/null; then
                echo "Includes $b: $(git rev-parse --short "origin/$b")$(git merge-base --is-ancestor "origin/$b" HEAD && echo '' || echo ' (NOT fully merged)')"
              fi
            done
            echo
            echo "Changes since ${last:-the fork point}:"
            git log --no-merges --format='- %s' "${last:-$base}..HEAD" | head -50
          } > "$RUNNER_TEMP/tag-msg.txt"

          git tag -a "$tag" -F "$RUNNER_TEMP/tag-msg.txt"
          git push origin "refs/tags/$tag"
          echo "created $tag"
          # a tag pushed with the Actions token does not trigger workflows; start the build directly
          gh workflow run sbb-release.yml --ref session-but-better -f tag="$tag"
